# The law gate's batch on boat (tests/check_laws.sh): this checkout shipped as is, gdp-wired-cli by bunx on the pool's
# image ($SUPERCOMPUTER_IMAGE, the one its VMs run: bun on it), nothing built.
# rules/cpu.py and rules/affinity.py cover exact models, distinct VM history/ACKs, and endpoint affinity,
# alongside their broken variants in check_laws.sh. rules/updates.py also proves fresh handoff
# observation intervals, sub_preempt_s idle qualification and strict first-sample hard faults.
name = "supercomputer"

[boat]
vm_type = "large"
path = ["~/.bun/bin"]
ignore = ["**/__pycache__/**", "live/**", "**/runs/**"]
