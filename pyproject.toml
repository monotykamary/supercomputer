[project]
name = "supercomputer"
version = "0.1.0"
description = "One job runner over boat.dev VMs (a warm, shared pool), RunPod for GPU jobs, and Modal as the fallback."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "monotykamary" }]
requires-python = ">=3.12"
# The tool itself is the standard library; the Modal client is the fallback of every batch.
dependencies = ["modal>=1.6"]

[project.urls]
Homepage = "https://github.com/monotykamary/supercomputer"
Issues = "https://github.com/monotykamary/supercomputer/issues"

[project.scripts]
supercomputer = "supercomputer.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["supercomputer"]

# The agents' guide ships inside the package, so `supercomputer --skill` works from an installed wheel too.
[tool.hatch.build.targets.wheel.force-include]
"SKILL.md" = "supercomputer/SKILL.md"
