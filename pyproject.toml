[project]
name = "supercomputer"
version = "0.1.0"
description = "One job runner over boat.dev VMs (a warm, shared pool) and RunPod for GPU jobs; no provider fallback."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "monotykamary" }]
requires-python = ">=3.12"
# The tool itself is standard-library-only. Temporarily retain the Modal CLI
# solely for legacy app cleanup/recovery; remove it once all old apps are gone.
dependencies = ["modal>=1.6"]

[project.urls]
Homepage = "https://github.com/monotykamary/supercomputer"
Issues = "https://github.com/monotykamary/supercomputer/issues"

[project.scripts]
supercomputer = "supercomputer.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["supercomputer"]

# The agents' guide ships inside the package, so `supercomputer --skill` works from an installed wheel too.
[tool.hatch.build.targets.wheel.force-include]
"SKILL.md" = "supercomputer/SKILL.md"
